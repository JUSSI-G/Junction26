# MariaDB for AikaKone.  Local dev:  docker compose up -d --wait
# Full deploy (e.g. a Verda CPU instance):    docker compose --profile app up -d --build
# Tables are created by `python -m common.schema` (make db / the app container does it), not
# mounted into the container: Docker Desktop can't always see files under OneDrive/iCloud paths.
services:
  mariadb:
    image: mariadb:lts          # 12.x; needs >= 10.11 for system_versioning_insert_history
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-wiki}
    command:
      - --max_allowed_packet=256M
      - --innodb_buffer_pool_size=${INNODB_BUFFER_POOL:-2G}
      - --max_recursive_iterations=100000
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - wiki-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  # API + frontend. Load data into it with e.g.
  #   docker compose run --rm app python -m ingest.download --all
  #   docker compose run --rm app python -m ingest.replay --dataset large --workers 8
  app:
    profiles: ["app"]
    build: .
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DB_HOST: mariadb
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-wiki}
      DATASET: ${DATASET:-large}
      SCORING_URL: ${SCORING_URL:-}
      GEMMA_MODEL: ${GEMMA_MODEL:-}
    volumes:
      - ./data:/app/data
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  wiki-data:
